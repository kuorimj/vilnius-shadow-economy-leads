name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the pipeline on the committed snapshot
        run: docker compose up --build --exit-code-from pipeline
      - name: Check the lead list matches the committed one
        run: git diff --exit-code data/output/