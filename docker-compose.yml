services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 2s
      timeout: 5s 
      retries: 30

  pipeline:
    build: .
    command: ["python", "-m", "shadow.run", "--month", "${RUN_MONTH:-2026-11}", "--mode", "${RUN_MODE:-replay}"]
    environment:
      DATABASE_URL: postgresql://leads:leads@db:5432/leads
      OXYLABS_WEB_API_KEY: ${OXYLABS_WEB_API_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: